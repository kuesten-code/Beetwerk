services:
  beetwerk:
    build: .
    image: kuestencode/beetwerk:${BEETWERK_VERSION:-latest}
    container_name: beetwerk
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
    # Gleiche UID/GID wie der Besitzer von ./data, damit der Container hineinschreiben darf.
    user: "${BEETWERK_UID:-1000}:${BEETWERK_GID:-1000}"
    ports:
      # Standard nur lokal erreichbar; HTTPS übernimmt der Reverse Proxy auf dem Host.
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8180}:8080"
    volumes:
      - ./data:/data
